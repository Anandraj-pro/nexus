# ─── Nexus Career Paths ─────────────────────────────────────────────────────

paths:
  path_a:
    name: Stretch / Senior Track
    description: Roles requiring personal judgment — Nexus queues these for your review
    human_approval_required: true
    max_per_day: 3
    score_threshold: 60
    resume_variant: path_a
    auto_apply: false
    queue_label: Needs Your Review
    target_titles:
    - Director of QA
  path_b:
    name: Primary Track
    description: Strong-fit roles — Nexus applies automatically before the deadline
    human_approval_required: false
    max_per_day: 15
    score_threshold: 72
    resume_variant: path_b
    auto_apply: true
    queue_label: Auto-Applied
    target_titles:
    - Senior QE Manager
    - QA Manager
scoring_signals:
  strong_positive:
  - CI/CD
  - test automation
  mild_positive:
  - agile
  strong_negative:
  - fresher
  mild_negative:
  - gaming
