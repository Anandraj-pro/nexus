# ─── Nexus Career Paths ─────────────────────────────────────────────────────
# Path A = stretch roles (human review before applying).
# Path B = primary track (auto-applied before deadline).

paths:
  path_a:
    name: Stretch / Senior Track
    description: Roles requiring personal judgment — Nexus queues these for your review
    human_approval_required: true
    max_per_day: 3
    score_threshold: 60
    resume_variant: path_a
    auto_apply: false
    queue_label: Needs Your Review
    target_titles:
      - Director of Quality Engineering
      - Director of QA
      - VP of Quality
      - Head of Quality Engineering
      - Head of QE

  path_b:
    name: Primary Track
    description: Strong-fit roles — Nexus applies automatically before the deadline
    human_approval_required: false
    max_per_day: 15
    score_threshold: 72
    resume_variant: path_b
    auto_apply: true
    queue_label: Auto-Applied
    target_titles:
      - Senior QE Manager
      - QE Manager
      - QA Manager
      - Quality Engineering Manager
      - Lead QE
      - Lead Quality Engineer
      - Engineering Manager - QA

scoring_signals:
  strong_positive:
    - automation architecture
    - test framework
    - CI/CD
    - quality strategy
    - team building
    - shift-left
    - Playwright
    - pytest

  mild_positive:
    - agile
    - scrum
    - API testing
    - Selenium
    - Python
    - cloud
    - Jira

  strong_negative:
    - fresher
    - 0-2 years
    - junior
    - manual testing only
    - entry level

  mild_negative:
    - gaming
    - hardware
    - embedded systems
    - blockchain
