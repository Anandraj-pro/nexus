# ─── Nexus Agent Configuration ──────────────────────────────────────────────

system:
  name: Nexus
  version: 1.0.0
  timezone: Asia/Kolkata
  log_level: INFO
  log_file: logs/nexus.log
  db_path: db/nexus.db
schedule:
  scout_start: 05:00
  apply_deadline: 09:15
  scout_interval_minutes: 30
llm:
  provider: ollama
  base_url: http://localhost:11434
  scorer_model: llama3.2
  temperature: 0.3
scout:
  enabled: true
  platforms:
  - naukri
  - greenhouse
  - lever
  - indeed
  keywords:
  - Senior QE Manager
  - Lead QE
  - QA Manager
  - Quality Engineering Manager
  - Director Quality Assurance
  - Head of Quality Engineering
  locations:
  - Hyderabad
  - Remote
  - India Remote
  exclude_keywords:
  - fresher
  - 0-2 years
  - junior
  - associate
  max_jobs_per_run: 100
  deduplicate: true
scorer:
  enabled: true
  score_range:
  - 0
  - 100
  path_b_threshold: 72
  path_a_threshold: 60
  below_threshold_action: skip
  scoring_weights:
    experience_match: 0.3
    skills_match: 0.35
    domain_match: 0.2
    seniority_match: 0.15
tailor:
  enabled: true
  resume_template_path_a: resources/resumes/resume_path_a.md
  resume_template_path_b: resources/resumes/resume_path_b.md
  output_dir: resources/resumes/tailored/
apply:
  enabled: true
  live_mode: true
  browser: chromium
  headless: true
  slow_mo_ms: 50
  timeout_ms: 30000
  retry_attempts: 2
  on_captcha: skip_and_flag
  candidate_experience_years: 17
reporter:
  enabled: true
  channels:
  - telegram
  - email
voice:
  whisper_model: base
  tts_rate: 170
  silence_threshold: 0.015
  silence_secs: 1.5
vault:
  credential_backend: keyring
  session_dir: resources/credentials/sessions/
  rotate_sessions: true
  max_session_age_hours: 24
