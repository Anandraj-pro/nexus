[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus"
version = "1.0.0"
description = "Autonomous job-hunt agent — connects your skills to the right openings"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }

dependencies = [
    # LLM — local inference via Ollama (zero API cost)
    "ollama>=0.3.0",

    # Orchestration
    "langgraph>=0.2.0",

    # Web scraping & browser automation
    "playwright>=1.44.0",
    "beautifulsoup4>=4.12.0",
    "httpx>=0.27.0",
    "selenium>=4.21.0",

    # Vector store
    "chromadb>=0.5.0",

    # Database
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",

    # Config & env
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",

    # Scheduling
    "apscheduler>=3.10.4",
    "pytz>=2024.1",

    # Notifications
    "python-telegram-bot>=21.3",
    "google-auth>=2.29.0",
    "google-auth-oauthlib>=1.2.0",
    "google-auth-httplib2>=0.2.0",
    "google-api-python-client>=2.130.0",

    # PDF generation (resume → PDF for Greenhouse/Lever upload)
    "fpdf2>=2.8.0",
    "markdown>=3.5.0",

    # Credential management
    "keyring>=25.2.0",

    # CLI
    "click>=8.1.7",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]
voice = [
    "openai-whisper>=20231117",
    "pyttsx3>=2.90",
    "sounddevice>=0.4.6",
    "scipy>=1.13.0",
]
ui = [
    "streamlit>=1.35.0",
    "pdfplumber>=0.11.0",
    "python-docx>=1.1.0",
]

[project.scripts]
nexus = "orchestrator:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["agents*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]